services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
        WEB_INTERNAL_PORT: ${WEB_INTERNAL_PORT:-80}
    container_name: ${WEB_CONTAINER_NAME:-tripleg-web}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      WEB_INTERNAL_PORT: ${WEB_INTERNAL_PORT:-80}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-drupal}
      DB_USER: ${DB_USER:-drupal}
      DB_PASSWORD: ${DB_PASSWORD:-drupal}
      HASH_SALT: ${HASH_SALT:-RandomHashSaltForDevelopmentPurposesOnly}
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_CACHE_PREFIX: ${VALKEY_CACHE_PREFIX:-dev_3G_}
    ports:
      - "${WEB_EXTERNAL_PORT:-8081}:${WEB_INTERNAL_PORT:-80}"
    volumes:
      - "${HOST_PROJECT_ROOT:-/Volumes/MacDaddyPro/Projects/Sites/triple-g.dev}:/var/www/html"
    networks:
      - frontend
      - backend
    restart: unless-stopped

  db:
    image: mariadb:${MARIADB_VERSION:-11.4}
    container_name: ${DB_CONTAINER_NAME:-tripleg-db}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-drupal}
      MARIADB_USER: ${DB_USER:-drupal}
      MARIADB_PASSWORD: ${DB_PASSWORD:-drupal}
      MARIADB_PORT_NUMBER: ${DB_PORT:-3306}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-8-alpine}
    container_name: ${VALKEY_CONTAINER_NAME:-montreal2027-valkey}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  db_data:
    name: ${DB_VOLUME_NAME:-tripleg_db_data}

networks:
  frontend:
    name: ${FRONTEND_NETWORK_NAME:-tripleg_frontend}
  backend:
    name: ${BACKEND_NETWORK_NAME:-tripleg_backend}
    internal: true
