name: Triple G build and deploy

on:
  pull_request:
    types: [closed]
    branches: ['develop']
  push:
    branches: ['feature/**']
  workflow_dispatch:

jobs:
  secrets:
    uses: ./.github/workflows/secrets.yml

  deploy:
    needs: secrets
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.event_name == 'push' && 'feature' || 'develop' }}
      cancel-in-progress: false
    steps:
      - name: Deploy exact commit
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_REF: ${{ github.event_name == 'push' && github.ref_name || 'develop' }}
          DEPLOY_SHA: ${{ github.sha }}
          DEV_DEPLOY_PATH: ${{ vars.DEV_DEPLOY_PATH }}
          STG_DEPLOY_PATH: ${{ vars.STG_DEPLOY_PATH }}
          DEV_BU_FILE_PREFIX: ${{ vars.DEV_BU_FILE_PREFIX }}
          STG_BU_FILE_PREFIX: ${{ vars.STG_BU_FILE_PREFIX }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_EVENT,DEPLOY_REF,DEPLOY_SHA,DEV_DEPLOY_PATH,STG_DEPLOY_PATH,DEV_BU_FILE_PREFIX,STG_BU_FILE_PREFIX
          script: |
            set -euo pipefail

            case "$DEPLOY_EVENT" in
              push)
                : "${DEV_DEPLOY_PATH:?Set the DEV_DEPLOY_PATH Actions variable}"
                : "${DEV_BU_FILE_PREFIX:?Set the DEV_BU_FILE_PREFIX Actions variable}"
                DEPLOY_PATH="$DEV_DEPLOY_PATH"
                BU_FILE_PREFIX="$DEV_BU_FILE_PREFIX"
                ;;
              pull_request)
                : "${STG_DEPLOY_PATH:?Set the STG_DEPLOY_PATH Actions variable}"
                : "${STG_BU_FILE_PREFIX:?Set the STG_BU_FILE_PREFIX Actions variable}"
                DEPLOY_PATH="$STG_DEPLOY_PATH"
                BU_FILE_PREFIX="$STG_BU_FILE_PREFIX"
                ;;
              *)
                echo "Unsupported deploy event: $DEPLOY_EVENT" >&2
                exit 1
                ;;
            esac

            echo "Changing to deploy path: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            echo "Backing up database"
            drush sql:dump --gzip --results-file="/var/www/db_backups/${BU_FILE_PREFIX}.$(date +'%Y-%m-%d_%H:%M:%S').sql.gz"
            echo "Setting proper permissions"
            chmod -R u+w web/sites/default
            echo "Fetching $DEPLOY_REF and checking out $DEPLOY_SHA"
            git fetch --no-tags origin "$DEPLOY_REF"
            git checkout --detach "$DEPLOY_SHA"
            echo "Installing Composer dependencies"
            composer install
            echo "Installing npm dependencies"
            npm ci
            echo "Building assets"
            npm run build
            echo "Cleaning up node_modules"
            rm -rf node_modules
            echo "Running drush deploy"
            drush deploy
